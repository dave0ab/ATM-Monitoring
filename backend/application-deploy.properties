# ATM Monitoring System - Deployment Configuration
# This file contains deployment-specific settings that override other profiles

# Server Configuration
server.port=9000
server.servlet.context-path=/api

# Jasypt Configuration (ensure these match your main application.properties)
jasypt.encryptor.bean=jasyptStringEncryptor
jasypt.encryptor.property.prefix=ENC(
jasypt.encryptor.property.suffix=)

# Logging Configuration for Production
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
logging.level.org.springframework.security=INFO
logging.level.com.zemenbank.atmMonitoring=INFO

# Enable health endpoints for monitoring
management.health.ldap.enabled=false
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Performance settings
server.tomcat.connection-timeout=120000
server.tomcat.keep-alive-timeout=120000
server.tomcat.max-keep-alive-requests=100
server.tomcat.max-connections=8192
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10

# JVM Settings (add these as JVM arguments when running)
# -Xms512m
# -Xmx2048m
# -XX:+UseG1GC
# -XX:MaxGCPauseMillis=200
# -Dfile.encoding=UTF-8
# -Duser.timezone=Africa/Addis_Ababa

# Security Headers
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Session timeout (30 minutes)
server.servlet.session.timeout=30m

# File upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Connection pool optimization
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=60000 