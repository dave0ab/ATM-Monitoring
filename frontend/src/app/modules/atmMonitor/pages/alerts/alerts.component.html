<div class="space-y-6">
  <h2 class="text-2xl font-bold">Alerts</h2>
  <div class="bg-white shadow rounded-lg overflow-hidden">
    <div
      *ngFor="let notification of notifications"
      class="p-4 border-b last:border-b-0"
    >
      <div class="flex items-center">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          [ngClass]="{
            'h-5 w-5 mr-2': true,
            'text-red-500': notification.severity === 'high',
            'text-yellow-500': notification.severity === 'medium',
            'text-blue-500': notification.severity === 'low'
          }"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
          />
        </svg>
        <div>
          <p class="font-semibold">{{ notification.message }}</p>
          <p class="text-sm text-gray-500">{{ notification.time }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
