<main
  class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-100 dark:bg-gray-900 p-6"
  >
  <h1 class="text-3xl font-semibold text-gray-800 dark:text-white mb-6">
    Dashboard
  </h1>

  <!-- Summary Cards -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-6">
    @for (card of summaryCards; track card) {
      <div
        class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6 transition-all duration-300 hover:shadow-lg"
        (click)="onCardClick()"
        >
        <div class="flex items-center">
          <div [ngClass]="card.iconClass" class="rounded-full p-3 mr-4">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-6 w-6"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                [attr.d]="card.iconPath"
                />
              </svg>
            </div>
            <div>
              <p class="text-sm font-medium text-gray-600 dark:text-gray-400">
                {{ card.label }}
              </p>
              <p class="text-2xl font-semibold text-gray-800 dark:text-white">
                {{ card.value }}
              </p>
            </div>
          </div>
        </div>
      }
    </div>

    <!-- Charts -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-2 gap-6 mb-6">
      <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6">
        <h2 class="text-xl font-semibold text-gray-800 dark:text-white mb-4">
          ATM Status Trend
        </h2>
        <div class="h-full w-full max-w-full max-h-[400px]">
          <canvas id="lineChart"></canvas>
        </div>
      </div>
      <div
        class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6 flex justify-center items-center"
        >
        <div
          class="h-full w-full flex justify-center items-center max-w-full max-h-[400px]"
          >
          <canvas id="pieChart"></canvas>
        </div>
      </div>
    </div>
  </main>
