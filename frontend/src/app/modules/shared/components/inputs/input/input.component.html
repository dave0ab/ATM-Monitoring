<label [for]="name" class="absolute z-20 inline-block px-1 -mt-px text-xs font-medium bg-white -top-2 left-2 text-slate-700 dark:text-slate-300 dark:bg-transparent">
  {{ label }}
  @if (required) {
    <span class="text-red-500">*</span>
  }
</label>
<input
  matInput
  [name]="name"
  [id]="name"
  [type]="type"
  [value]="value"
  (input)="onChange($any($event.target).value)"
  (blur)="onTouched()"
  [placeholder]="placeholder ? placeholder : ''"
  [ngClass]="inputClass"
  class="bg-gray-50 border border-gray-300 text-gray-900 sm:text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5"    />
  @if (helpText) {
    <p class="mt-1 text-sm leading-5 text-slate-500 dark:text-slate-400">{{ helpText }}</p>
  }
